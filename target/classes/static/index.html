<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexTemps Job Monitor</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1><span class="highlight">FlexTemps</span> Job Monitor</h1>
            <div class="status-badge" id="global-status">Waiting for job...</div>
        </header>

        <div class="main-content">
            <div class="progress-section">
                <div class="progress-bar-container">
                     <div class="progress-bar" id="total-progress"></div>
                </div>
                <div class="progress-stats">
                    <span id="steps-completed">0 / 20 Steps</span>
                    <span id="total-duration">00:00</span>
                </div>
            </div>

            <div class="timeline" id="timeline">
                <!-- Steps will be injected here via JS -->
            </div>
        </div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
